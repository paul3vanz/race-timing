apply plugin: 'com.android.library'

group = 'expo.modules.volumekeys'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Use the SDK versions managed by the app (expo-modules-core), same as the
// scaffold `create-expo-module --local` produces.
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.volumekeys"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lint {
    abortOnError false
  }
}
